[package]
name = "horon-messenger-sdk"
description = "The public library surface for horon-messenger: one client over every messenger provider a build enabled."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["mock"]
mock = ["dep:horon-messenger-provider-mock"]
kakaotalk = ["dep:horon-messenger-provider-kakaotalk"]
discord = ["dep:horon-messenger-provider-discord"]
telegram = ["dep:horon-messenger-provider-telegram"]
channeltalk = ["dep:horon-messenger-provider-channeltalk"]
telegrambot = ["dep:horon-messenger-provider-telegrambot"]
whatsappbot = ["dep:horon-messenger-provider-whatsappbot"]
slackbot = ["dep:horon-messenger-provider-slackbot"]
slack = ["dep:horon-messenger-provider-slack"]
imessage = ["dep:horon-messenger-provider-imessage"]
whatsapp = ["dep:horon-messenger-provider-whatsapp"]
line = ["dep:horon-messenger-provider-line"]
instagram = ["dep:horon-messenger-provider-instagram"]
all = ["mock", "kakaotalk", "discord", "telegram", "channeltalk", "telegrambot", "whatsappbot", "slackbot", "slack", "imessage", "whatsapp", "line", "instagram"]
schemars = ["horon-messenger-core/schemars"]

[dependencies]
horon-messenger-core.workspace = true
horon-messenger-provider-mock = { workspace = true, optional = true }
horon-messenger-provider-kakaotalk = { workspace = true, optional = true }
horon-messenger-provider-discord = { workspace = true, optional = true }
horon-messenger-provider-telegram = { workspace = true, optional = true }
horon-messenger-provider-channeltalk = { workspace = true, optional = true }
horon-messenger-provider-telegrambot = { workspace = true, optional = true }
horon-messenger-provider-whatsappbot = { workspace = true, optional = true }
horon-messenger-provider-slackbot = { workspace = true, optional = true }
horon-messenger-provider-slack = { workspace = true, optional = true }
horon-messenger-provider-imessage = { workspace = true, optional = true }
horon-messenger-provider-whatsapp = { workspace = true, optional = true }
horon-messenger-provider-line = { workspace = true, optional = true }
horon-messenger-provider-instagram = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
