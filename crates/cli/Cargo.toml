[package]
name = "horon-messenger-cli"
description = "The horon-messenger command line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "horon-messenger"
path = "src/main.rs"

[features]
kakaotalk = ["horon-messenger-sdk/kakaotalk"]
discord = ["horon-messenger-sdk/discord"]
telegram = ["horon-messenger-sdk/telegram"]
channeltalk = ["horon-messenger-sdk/channeltalk"]
telegrambot = ["horon-messenger-sdk/telegrambot"]
whatsappbot = ["horon-messenger-sdk/whatsappbot"]
slackbot = ["horon-messenger-sdk/slackbot"]
slack = ["horon-messenger-sdk/slack"]
imessage = ["horon-messenger-sdk/imessage"]
whatsapp = ["horon-messenger-sdk/whatsapp"]
line = ["horon-messenger-sdk/line"]
instagram = ["horon-messenger-sdk/instagram"]
all = ["horon-messenger-sdk/all"]

[dependencies]
horon-messenger-sdk.workspace = true
clap.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
