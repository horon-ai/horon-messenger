[package]
name = "horon-messenger-mcp"
description = "The horon-messenger MCP server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "horon-messenger-mcp"
path = "src/main.rs"

[features]
default = ["mock"]
mock = ["horon-messenger-sdk/mock"]
kakaotalk = ["horon-messenger-sdk/kakaotalk"]
discord = ["horon-messenger-sdk/discord"]
telegram = ["horon-messenger-sdk/telegram"]
channeltalk = ["horon-messenger-sdk/channeltalk"]
telegrambot = ["horon-messenger-sdk/telegrambot"]
whatsappbot = ["horon-messenger-sdk/whatsappbot"]
slackbot = ["horon-messenger-sdk/slackbot"]
slack = ["horon-messenger-sdk/slack"]
imessage = ["horon-messenger-sdk/imessage"]
whatsapp = ["horon-messenger-sdk/whatsapp"]
line = ["horon-messenger-sdk/line"]
instagram = ["horon-messenger-sdk/instagram"]
all = ["mock", "kakaotalk", "discord", "telegram", "channeltalk", "telegrambot", "whatsappbot", "slackbot", "slack", "imessage", "whatsapp", "line", "instagram"]

[dependencies]
horon-messenger-sdk = { workspace = true, features = ["schemars"] }
anyhow.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
