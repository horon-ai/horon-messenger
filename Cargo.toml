[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/sdk",
  "crates/cli",
  "crates/mcp",
  "crates/server",
  "crates/ui",
  "crates/providers/common",
  "crates/providers/mock",
  "crates/providers/kakaotalk",
  "crates/providers/discord",
  "crates/providers/telegram",
  "crates/providers/channeltalk",
  "crates/providers/telegrambot",
  "crates/providers/whatsappbot",
  "crates/providers/slackbot",
  "crates/providers/slack",
  "crates/providers/imessage",
  "crates/providers/whatsapp",
  "crates/providers/line",
  "crates/providers/instagram",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/horon-ai/horon-messenger"
authors = ["minyeol"]
description = "Multi-messenger bridge for AI agents: one CLI, SDK, MCP server and API server across KakaoTalk, Discord, Telegram, Channel Talk and more."

[workspace.dependencies]
horon-messenger-core = { path = "crates/core", version = "0.1.0" }
horon-messenger-sdk = { path = "crates/sdk", version = "0.1.0" }
horon-messenger-provider-common = { path = "crates/providers/common", version = "0.1.0" }
horon-messenger-provider-mock = { path = "crates/providers/mock", version = "0.1.0" }
horon-messenger-provider-kakaotalk = { path = "crates/providers/kakaotalk", version = "0.1.0" }
horon-messenger-provider-discord = { path = "crates/providers/discord", version = "0.1.0" }
horon-messenger-provider-telegram = { path = "crates/providers/telegram", version = "0.1.0" }
horon-messenger-provider-channeltalk = { path = "crates/providers/channeltalk", version = "0.1.0" }
horon-messenger-provider-telegrambot = { path = "crates/providers/telegrambot", version = "0.1.0" }
horon-messenger-provider-whatsappbot = { path = "crates/providers/whatsappbot", version = "0.1.0" }
horon-messenger-provider-slackbot = { path = "crates/providers/slackbot", version = "0.1.0" }
horon-messenger-provider-slack = { path = "crates/providers/slack", version = "0.1.0" }
horon-messenger-provider-imessage = { path = "crates/providers/imessage", version = "0.1.0" }
horon-messenger-provider-whatsapp = { path = "crates/providers/whatsapp", version = "0.1.0" }
horon-messenger-provider-line = { path = "crates/providers/line", version = "0.1.0" }
horon-messenger-provider-instagram = { path = "crates/providers/instagram", version = "0.1.0" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
