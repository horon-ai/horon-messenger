name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify the tag matches the manifest version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -e "const m=require('fs').readFileSync('Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m); if(!m) process.exit(1); console.log(m[1])")
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "the tag $tag does not match the manifest version $manifest" >&2
            exit 1
          fi

  binaries:
    name: build ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - platform: darwin-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - platform: linux-x64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64-gnu
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: win32-x64-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal --target ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Build the four surfaces
        run: cargo build --release --all-features --target ${{ matrix.target }} -p horon-messenger-cli -p horon-messenger-mcp -p horon-messenger-server -p horon-messenger-ui
      - name: Collect the platform binaries
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p dist
          for bin in horon-messenger horon-messenger-mcp horon-messenger-server horon-messenger-tui; do
            cp "target/${{ matrix.target }}/release/${bin}${ext}" "dist/${bin}${ext}"
          done
      - name: Upload the platform binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/*
      - name: Stage and publish the platform packages
        if: env.NPM_TOKEN != ''
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          for surface in cli mcp server ui; do
            case "$surface" in
              cli) bin=horon-messenger ;;
              mcp) bin=horon-messenger-mcp ;;
              server) bin=horon-messenger-server ;;
              ui) bin=horon-messenger-tui ;;
            esac
            dir=$(node npm/scripts/stage.mjs "$surface" "${{ matrix.platform }}" "target/${{ matrix.target }}/release/${bin}${ext}")
            npm publish "$dir" --access public
          done

  release:
    name: publish the GitHub Release
    needs: [binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the GitHub Release with the binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p release
          for dir in artifacts/binaries-*; do
            platform="${dir#artifacts/binaries-}"
            for f in "$dir"/*; do
              base="$(basename "$f")"
              ext=""
              case "$base" in *.exe) ext=".exe" ;; esac
              name="${base%.exe}"
              cp "$f" "release/${name}-${platform}${ext}"
            done
          done
          ls -1 release
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; nothing to do"
            exit 0
          fi
          gh release create "$tag" --title "$tag" --generate-notes release/*

  wrappers:
    name: publish wrappers
    needs: binaries
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish the wrapper packages
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node npm/scripts/sync-version.mjs
          for surface in cli mcp server; do
            (cd "npm/$surface" && npm publish --access public)
          done

  bundles:
    name: publish bundles
    needs: wrappers
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish the bundle packages
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node npm/scripts/sync-version.mjs
          for bundle in server-mcp server-tui server-mcp-tui; do
            (cd "npm/bundles/$bundle" && npm publish --access public)
          done

  full:
    name: publish full package
    needs: bundles
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish the all-in-one package
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node npm/scripts/sync-version.mjs
          (cd npm/full && npm publish --access public)
